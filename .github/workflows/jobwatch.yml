name: jobwatch

on:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC = 06:00 Wien (Sommerzeit), 05:00 im Winter
  workflow_dispatch:       # Knopf "Run workflow" zum manuellen Start

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: jobwatch
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Browser für JavaScript-Seiten installieren
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Crawler laufen lassen
        env:
          JOBWATCH_JS: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python crawler.py

      - name: Webseite bauen
        run: |
          mkdir -p site
          cp app.html site/index.html
          printf "User-agent: *\nDisallow: /\n" > site/robots.txt

      - name: Ergebnisdateien privat ablegen (nur für Dich im Lauf downloadbar)
        uses: actions/upload-artifact@v4
        with:
          name: ergebnisse
          path: |
            anrufliste_*.csv
            status_*.csv
          retention-days: 30

      - name: Stand (state.json) speichern
        run: |
          git config user.name "jobwatch-bot"
          git config user.email "jobwatch-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "jobwatch: Stand $(date +%F)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: crawl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
